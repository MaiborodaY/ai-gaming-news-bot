name = "ai-gaming-news-bot"
main = "src/worker.js"
compatibility_date = "2026-04-30"

[vars]
CHANNEL_ID = "@BroNewsWorld"
FINANCE_CHANNEL_ID = "@BroProNews"

[[kv_namespaces]]
binding = "DRAFTS"
id = "3181a3c53f9140afaaafbc1cd77a2e82"

[triggers]
crons = ["0 12-16/2 * * *", "0 10,11,18,19 * * *", "0 9,10,19,20 * * *", "0 8,9,14,15,17,18 * * *"]

[observability]
enabled = true

  [observability.logs]
  invocation_logs = true
  head_sampling_rate = 1
